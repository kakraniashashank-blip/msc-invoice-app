<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRHP Analyzer v5</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script>
(function () {
  try {
    var t = localStorage.getItem('drhp_theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #0f0f0f; --surface: #141414; --surface-2: #1a1a1a;
    --border: #2a2a2a; --border-light: #252525;
    --text-primary: #e8e4da; --text-secondary: #ccc; --text-muted: #666; --text-dim: #555;
    --gold: #c8b97a; --gold-dim: #3a3020;
    --green: #5aaa7a; --green-dim: #1a4a2a; --green-bg: #0a1a0f;
    --red: #e87a7a; --red-dim: #3a1a1a; --red-bg: #1a0a0a;
    --amber: #b89a3a; --amber-dim: #3a3200; --amber-bg: #1a1400;
    --blue: #7a9aee; --blue-dim: #1a2a4a; --blue-bg: #0a0f1a;
  }
  html[data-theme="light"] {
    --bg: #f4f2ed; --surface: #ffffff; --surface-2: #f8f7f4;
    --border: #ddd9d0; --border-light: #e8e4da;
    --text-primary: #1a1a1a; --text-secondary: #333333; --text-muted: #666666; --text-dim: #888888;
    --gold: #8b6914; --gold-dim: #f0e5c0;
    --green: #2d7a4f; --green-dim: #c8e8d4; --green-bg: #eef7f1;
    --red: #c0392b; --red-dim: #f0c8c4; --red-bg: #fdf0ee;
    --amber: #8b6900; --amber-dim: #f0e0a0; --amber-bg: #fdf7e0;
    --blue: #2c5aa0; --blue-dim: #c8d8f0; --blue-bg: #eef2fa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: var(--bg); color: var(--text-primary);
    min-height: 100vh; padding: 2rem;
    transition: background 0.2s, color 0.2s;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  .header { border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: baseline; gap: 1rem; }
  .header h1 { font-size: 22px; font-weight: 400; letter-spacing: 0.05em; }
  .header span { font-size: 12px; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .header-spacer { flex: 1; }
  .theme-toggle, .ghost-btn {
    padding: 7px 14px; background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-size: 12px; font-family: 'Georgia', serif; cursor: pointer; border-radius: 4px; letter-spacing: 0.05em; transition: all 0.2s;
  }
  .theme-toggle:hover, .ghost-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* Setup */
  .api-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; margin-bottom: 10px; align-items: center; }
  .api-row label, .model-row label { font-size: 12px; color: var(--text-muted); white-space: nowrap; letter-spacing: 0.05em; }
  .api-row input {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-primary);
    padding: 10px 14px; font-size: 13px; font-family: 'Courier New', monospace; border-radius: 4px; outline: none; width: 100%;
  }
  .api-row input:focus { border-color: var(--gold); }
  .validate-btn { padding: 10px 14px; background: none; border: 1px solid var(--border); color: var(--text-secondary); font-size: 12px; font-family: 'Georgia', serif; cursor: pointer; border-radius: 4px; white-space: nowrap; }
  .validate-btn:hover { border-color: var(--gold); color: var(--gold); }
  .validate-btn.valid { border-color: var(--green-dim); color: var(--green); }
  .validate-btn.invalid { border-color: var(--red-dim); color: var(--red); }
  .model-row { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-bottom: 10px; align-items: center; }
  .model-row select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 12px; font-size: 12px; font-family: 'Georgia', serif; border-radius: 4px; outline: none; cursor: pointer; width: 100%; }
  .model-row select:focus { border-color: var(--gold); }

  .drop-zone {
    border: 1px dashed var(--border); border-radius: 6px; padding: 1.5rem; text-align: center;
    color: var(--text-muted); font-size: 13px; cursor: pointer; margin-bottom: 10px; transition: border-color 0.2s;
  }
  .drop-zone:hover, .drop-zone.hover { border-color: var(--gold); color: var(--gold); }
  .drop-zone.loaded { border-style: solid; border-color: var(--green-dim); color: var(--green); }

  .run-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .run-btn {
    padding: 11px 26px; background: var(--gold); border: none; color: #0f0f0f; font-family: 'Georgia', serif;
    font-size: 14px; cursor: pointer; border-radius: 4px; letter-spacing: 0.03em;
  }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .quota-note { font-size: 11px; color: var(--text-dim); letter-spacing: 0.03em; }

  /* History */
  .history-section { margin: 1.25rem 0; display: none; }
  .history-section.show { display: block; }
  .history-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
  .history-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .history-chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--border);
    border-radius: 4px; background: var(--surface); font-size: 12px; color: var(--text-secondary); cursor: pointer;
  }
  .history-chip:hover { border-color: var(--gold); }
  .history-chip .del { color: var(--text-dim); cursor: pointer; padding: 0 2px; }
  .history-chip .del:hover { color: var(--red); }

  /* Progress */
  .progress-sec { display: none; margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 1.25rem; }
  .progress-sec.show { display: block; }
  .prog-steps { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pstep { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; color: var(--text-muted); background: var(--surface-2); }
  .pstep .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
  .pstep.running { border-color: var(--gold); color: var(--gold); }
  .pstep.running .dot { background: var(--gold); animation: pulse 1.1s infinite; }
  .pstep.done { border-color: var(--green-dim); color: var(--green); }
  .pstep.done .dot { background: var(--green); }
  .pstep.fail { border-color: var(--red-dim); color: var(--red); }
  .pstep.fail .dot { background: var(--red); }
  .pstep .retry { cursor: pointer; text-decoration: underline; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .prog-note { font-size: 12px; color: var(--text-muted); line-height: 1.6; }

  .err-banner { display: none; border: 1px solid var(--red-dim); background: var(--red-bg); color: var(--red); border-radius: 6px; padding: 12px 16px; font-size: 13px; margin-bottom: 1.25rem; line-height: 1.6; }
  .err-banner.show { display: block; }

  /* Results shell */
  .results { display: none; }
  .results.show { display: block; }
  .co-header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .co-header h2 { font-size: 26px; font-weight: 400; }
  .co-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.6; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 3px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--border); color: var(--text-secondary); }
  .chip.compelling { background: var(--green-bg); color: var(--green); border-color: var(--green-dim); }
  .chip.cautious { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-dim); }
  .chip.avoid { background: var(--red-bg); color: var(--red); border-color: var(--red-dim); }
  .chip.info { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-dim); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; }

  /* Tabs */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.75rem; flex-wrap: wrap; }
  .tab { padding: 10px 18px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); font-family: 'Georgia', serif; font-size: 13px; letter-spacing: 0.04em; cursor: pointer; }
  .tab:hover { color: var(--text-secondary); }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .tab-badge { display: inline-block; min-width: 17px; padding: 1px 5px; margin-left: 6px; border-radius: 8px; background: var(--red-bg); border: 1px solid var(--red-dim); color: var(--red); font-size: 10px; text-align: center; }

  .section-block { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 1.4rem 1.5rem; margin-bottom: 1.25rem; }
  .section-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 1rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .section-label .pageref { color: var(--text-dim); text-transform: none; letter-spacing: 0.02em; font-size: 11px; }
  .narrative { font-size: 13.5px; line-height: 1.75; color: var(--text-secondary); margin-bottom: 0.9rem; }
  .narrative:last-child { margin-bottom: 0; }

  /* Metric grid */
  .mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 1px; background: var(--border-light); border: 1px solid var(--border-light); border-radius: 6px; overflow: hidden; }
  .mtile { background: var(--surface); padding: 12px 14px; }
  .mtile .k { font-size: 11px; color: var(--text-muted); letter-spacing: 0.04em; margin-bottom: 5px; }
  .mtile .v { font-size: 16px; font-family: 'Courier New', monospace; color: var(--text-primary); }
  .mtile .v.pos { color: var(--green); } .mtile .v.neg { color: var(--red); } .mtile .v.warn { color: var(--amber); }
  .mtile .s { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; }

  /* Tables */
  .fin-table, .val-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 1.25rem; }
  .fin-table th, .fin-table td { padding: 8px 12px; border-bottom: 1px solid var(--border-light); text-align: right; }
  .fin-table th:first-child, .fin-table td:first-child { text-align: left; color: var(--text-secondary); font-family: 'Georgia', serif; }
  .fin-table th { color: var(--text-dim); font-weight: 400; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
  .fin-table td { color: var(--text-primary); font-family: 'Courier New', monospace; }
  .fin-table tr.subtotal td { border-top: 1px solid var(--border); font-weight: 700; }
  .fin-table tr.calc td { color: var(--gold); }
  .fin-table td.stub, .fin-table th.stub { color: var(--text-dim); }
  .fin-table tr.grp td { padding-top: 16px; color: var(--text-muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: none; }
  .val-table th, .val-table td { padding: 8px 12px; border-bottom: 1px solid var(--border-light); text-align: left; }
  .val-table th { color: var(--text-dim); font-weight: 400; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
  .val-table td { color: var(--text-secondary); }
  .val-table td.num { font-family: 'Courier New', monospace; color: var(--text-primary); text-align: right; }
  .val-table th.num { text-align: right; }
  .val-table tr.own-row td { background: rgba(200,185,122,0.07); border-left: 3px solid var(--gold); color: var(--text-primary); font-weight: 700; }
  .val-table tr.median-row td { color: var(--text-muted); font-style: italic; }
  .val-table tr.warn-row td { background: var(--amber-bg); }

  .tie-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 3px; font-size: 11px; letter-spacing: 0.05em; border: 1px solid var(--border); }
  .tie-badge.pass { background: var(--green-bg); color: var(--green); border-color: var(--green-dim); }
  .tie-badge.fail { background: var(--red-bg); color: var(--red); border-color: var(--red-dim); }
  .tie-badge.na { background: var(--surface-2); color: var(--text-dim); }

  /* Issue bar */
  .issue-bar { display: flex; height: 26px; border-radius: 4px; overflow: hidden; margin-bottom: 8px; border: 1px solid var(--border); }
  .fresh-seg { background: var(--gold); color: #111; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .ofs-seg { background: var(--surface-2); color: var(--text-muted); font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .issue-bar-legend { display: flex; gap: 18px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; margin-bottom: 12px; }
  .issue-bar-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* Band panel */
  .band-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .band-grid label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .band-grid input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 10px; font-size: 13px; font-family: 'Courier New', monospace; border-radius: 4px; outline: none; }
  .band-grid input:focus { border-color: var(--gold); }
  .rawlink { font-size: 12px; color: var(--blue); cursor: pointer; text-decoration: underline; }
  .band-check { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }

  /* Flags & scorecard */
  .flag-card { border: 1px solid var(--border); border-left: 3px solid var(--text-dim); border-radius: 4px; padding: 12px 16px; margin-bottom: 10px; background: var(--surface-2); }
  .flag-card.high { border-left-color: var(--red); }
  .flag-card.medium { border-left-color: var(--amber); }
  .flag-card.low { border-left-color: var(--blue); }
  .flag-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; flex-wrap: wrap; }
  .flag-title { font-size: 13.5px; color: var(--text-primary); }
  .flag-meta { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .flag-ev { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }

  .score-chip { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 11px; letter-spacing: 0.06em; }
  .score-chip.Low { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-dim); }
  .score-chip.Mid { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-dim); }
  .score-chip.High { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-dim); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  @media (max-width: 860px) { .two-col { grid-template-columns: 1fr; } body { padding: 1rem; } }

  .bull-box, .bear-box { border: 1px solid var(--border); border-radius: 6px; padding: 1.1rem 1.25rem; }
  .bull-box { border-left: 3px solid var(--green); }
  .bear-box { border-left: 3px solid var(--red); }
  .bb-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .bull-box .bb-label { color: var(--green); } .bear-box .bb-label { color: var(--red); }
  .bb-text { font-size: 13.5px; line-height: 1.7; color: var(--text-secondary); }

  ul.plain { list-style: none; }
  ul.plain li { font-size: 13px; line-height: 1.7; color: var(--text-secondary); padding-left: 16px; position: relative; margin-bottom: 5px; }
  ul.plain li::before { content: '—'; position: absolute; left: 0; color: var(--gold); }

  a { color: var(--blue); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>DRHP Analyzer</h1>
    <span>v5 · Gemini</span>
    <div class="header-spacer"></div>
    <button class="theme-toggle" id="themeToggle">Theme</button>
  </div>

  <div class="section-block" id="setupCard">
    <div class="api-row">
      <label for="apiKey">Gemini API key</label>
      <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
      <button class="validate-btn" id="validateBtn">Validate</button>
    </div>
    <div class="band-check" style="margin-bottom:10px">
      <input type="checkbox" id="rememberKey">
      <label for="rememberKey">Remember this key on this device</label>
    </div>
    <div id="storageWarn" style="display:none;border:1px solid var(--amber-dim);background:var(--amber-bg);color:var(--amber);border-radius:4px;padding:10px 14px;font-size:12.5px;line-height:1.6;margin-bottom:10px"></div>
    <div class="model-row">
      <label for="modelSelect">Primary model</label>
      <select id="modelSelect"></select>
    </div>
    <div class="drop-zone" id="dropZone">Drop the DRHP PDF here, or click to choose a file</div>
    <input type="file" id="pdfInput" accept="application/pdf" style="display:none">
    <div class="band-check" style="margin-bottom:10px">
      <input type="checkbox" id="forceInline">
      <label for="forceInline">Send the PDF inline instead of using the Files API (slower, works when file uploads are blocked; 18 MB limit)</label>
    </div>
    <div class="run-row">
      <button class="run-btn" id="runBtn" disabled>Run analysis</button>
      <button class="ghost-btn" id="testPdfBtn">Test PDF read</button>
      <span class="chip info" id="pathChip" style="display:none"></span>
      <span class="quota-note">One run = 4 extraction calls + 1 analysis call. Failed steps can be retried individually without redoing the run.</span>
    </div>
  </div>

  <div class="history-section show" id="historySection">
    <div class="history-label">Saved analyses</div>
    <div class="history-chips" id="historyChips"></div>
    <div style="margin-top:10px">
      <button class="ghost-btn" id="btnLoadJson">Load an analysis from a file</button>
      <input type="file" id="jsonInput" accept="application/json,.json" style="display:none">
    </div>
  </div>

  <div id="diagOut" style="margin-bottom:1.25rem"></div>

  <div class="progress-sec" id="progressSec">
    <div class="prog-steps" id="progSteps"></div>
    <div class="prog-note" id="progNote"></div>
    <div id="diagTable" style="margin-top:1rem"></div>
    <pre id="rawOut" style="white-space:pre-wrap;font-size:11.5px;color:var(--text-muted);margin-top:10px;max-height:300px;overflow:auto"></pre>
  </div>

  <div class="err-banner" id="errBanner"></div>

  <div class="results" id="results">
    <div class="co-header">
      <h2 id="coName"></h2>
      <span class="chip" id="verdictChip"></span>
      <span class="chip info" id="unitChip"></span>
      <span class="chip info" id="consolChip"></span>
    </div>
    <div class="co-sub" id="coSub"></div>
    <div class="toolbar">
      <button class="ghost-btn" id="btnExcel">Download Excel model</button>
      <button class="ghost-btn" id="btnSaveJson">Save analysis to file</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="financials">Financials</button>
      <button class="tab" data-tab="business">Business &amp; Industry</button>
      <button class="tab" data-tab="diligence">Diligence <span class="tab-badge" id="flagBadge" style="display:none"></span></button>
      <button class="tab" data-tab="wheretolook">Where to look</button>
    </div>
    <div class="tab-content active" id="tab-overview"></div>
    <div class="tab-content" id="tab-financials"></div>
    <div class="tab-content" id="tab-business"></div>
    <div class="tab-content" id="tab-diligence"></div>
    <div class="tab-content" id="tab-wheretolook"></div>
  </div>
</div>
<script>
'use strict';
/* ═══════════ CONFIG ═══════════ */
const MODELS = [
  { id: 'gemini-3.7-flash',      label: 'Gemini 3.7 Flash · 20 RPD',        },
  { id: 'gemini-3.6-flash',      label: 'Gemini 3.6 Flash · 20 RPD',        },
  { id: 'gemini-3.5-flash-lite', label: 'Gemini 3.5 Flash-Lite · 500 RPD',  },
  { id: 'gemini-3.8-flash',      label: 'Gemini 3.8 Flash · 20 RPD',        },
  { id: 'gemini-3.5-flash',      label: 'Gemini 3.5 Flash · 20 RPD',        }
];
const API_BASE = 'https://generativelanguage.googleapis.com';
const HIST_KEY = 'drhp_v5_history';
const DRAFT_KEY = 'drhp_v5_draft';
const MAX_HIST = 6;

/* ═══════════ STATE ═══════════ */
let pdfFile = null;          // File object
let pdfBase64 = null;        // lazy
let uploadedFileUri = null;  // Files API uri (48h life)
let pipeline = null;         // { steps: { fin, cap, biz, dil, ana } each {status,data,model,err} }
let A = null;                // active analysis bundle { name, ts, band, fin, cap, biz, dil, ana, derived }

const STEP_DEFS = [
  { key: 'upload', label: 'Upload PDF' },
  { key: 'map',    label: 'Document map' },
  { key: 'fin',    label: 'Financial statements' },
  { key: 'cap',    label: 'Capital & issue' },
  { key: 'biz',    label: 'Business & industry' },
  { key: 'dil',    label: 'Diligence' },
  { key: 'ana',    label: 'Analysis' }
];

/* ═══════════ UTILS ═══════════ */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const isNum = v => typeof v === 'number' && isFinite(v);
function fmtNum(v, dec) {
  if (!isNum(v)) return '—';
  if (dec === undefined) dec = Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2;
  return v.toLocaleString('en-IN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
const fmtPct = v => isNum(v) ? (v * 100).toFixed(1) + '%' : '—';
const fmtX   = v => isNum(v) ? v.toFixed(2) + 'x' : '—';
const fmtDays = v => isNum(v) ? Math.round(v) + 'd' : '—';
function median(arr) {
  const a = arr.filter(isNum).sort((x, y) => x - y);
  if (!a.length) return null;
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function parseNum(s) {
  if (isNum(s)) return s;
  if (typeof s !== 'string') return null;
  const m = s.replace(/,/g, '').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
/* Parse a rupee amount string into ₹ crore. Handles crore/lakh/million/billion. */
function parseAmountToCr(s) {
  if (isNum(s)) return s;
  if (typeof s !== 'string') return null;
  const n = parseNum(s);
  if (n === null) return null;
  const t = s.toLowerCase();
  if (/\bcr(ore)?s?\b|\bcr\.?/.test(t)) return n;
  if (/lakh|lac/.test(t)) return n / 100;
  if (/\bmillion\b|\bmn\b|\bmio\b/.test(t)) return n / 10;
  if (/\bbillion\b|\bbn\b/.test(t)) return n * 100;
  return n; // assume already crore
}
/* Factor to convert the extraction's currency_unit into crore. */
function unitToCrFactor(unit) {
  const t = (unit || '').toLowerCase();
  if (/cr(ore)?/.test(t)) return 1;
  if (/lakh|lac/.test(t)) return 0.01;
  if (/million|mn/.test(t)) return 0.1;
  if (/billion|bn/.test(t)) return 100;
  return 1;
}
function nowTs() { return new Date().toISOString(); }
function shortDate(iso) { try { return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } }

/* ═══════════ FILES API UPLOAD (with inline fallback) ═══════════ */
async function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('Could not read the PDF file.'));
    r.readAsDataURL(file);
  });
}
async function uploadToFilesApi(apiKey, file) {
  const start = await fetch(`${API_BASE}/upload/v1beta/files?key=${encodeURIComponent(apiKey)}`, {
    method: 'POST',
    headers: {
      'X-Goog-Upload-Protocol': 'resumable',
      'X-Goog-Upload-Command': 'start',
      'X-Goog-Upload-Header-Content-Length': String(file.size),
      'X-Goog-Upload-Header-Content-Type': 'application/pdf',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ file: { display_name: file.name } })
  });
  if (!start.ok) throw new Error('Upload start failed: HTTP ' + start.status);
  const uploadUrl = start.headers.get('x-goog-upload-url');
  if (!uploadUrl) throw new Error('Upload URL not returned (CORS).');
  const up = await fetch(uploadUrl, {
    method: 'POST',
    headers: { 'X-Goog-Upload-Command': 'upload, finalize', 'X-Goog-Upload-Offset': '0' },
    body: file
  });
  if (!up.ok) throw new Error('Upload failed: HTTP ' + up.status);
  const meta = await up.json();
  let f = meta.file;
  let tries = 0;
  while (f && f.state === 'PROCESSING' && tries < 60) {
    await sleep(3000);
    const r = await fetch(`${API_BASE}/v1beta/${f.name}?key=${encodeURIComponent(apiKey)}`);
    f = await r.json();
    tries++;
  }
  if (!f || f.state !== 'ACTIVE') throw new Error('File processing did not complete (state: ' + (f && f.state) + ').');
  return f.uri;
}
/* Returns the "document part" for generateContent: file ref if possible, else inline. */
let pdfPath = null;   // 'files-api' | 'inline'
async function ensurePdfPart(apiKey, note) {
  if (uploadedFileUri) return { fileData: { mimeType: 'application/pdf', fileUri: uploadedFileUri } };
  const forceInline = $('forceInline') && $('forceInline').checked;
  if (forceInline) {
    if (pdfFile.size > 18 * 1048576) throw new Error('Inline mode selected but the PDF is larger than 18 MB. Uncheck it and use the Files API.');
    note('Reading the PDF for inline upload…');
    if (!pdfBase64) pdfBase64 = await fileToBase64(pdfFile);
    pdfPath = 'inline';
    setPathChip();
    return { inlineData: { mimeType: 'application/pdf', data: pdfBase64 } };
  }
  try {
    note('Uploading PDF to the Files API…');
    uploadedFileUri = await uploadToFilesApi(apiKey, pdfFile);
    pdfPath = 'files-api';
    setPathChip();
    return { fileData: { mimeType: 'application/pdf', fileUri: uploadedFileUri } };
  } catch (e) {
    if (pdfFile.size > 18 * 1048576) throw new Error('Files API upload failed and the PDF is too large to send inline (>18 MB). ' + e.message);
    note('Files API unavailable (' + e.message + '). Falling back to inline upload — each extraction call will resend the PDF.');
    if (!pdfBase64) pdfBase64 = await fileToBase64(pdfFile);
    pdfPath = 'inline';
    setPathChip();
    return { inlineData: { mimeType: 'application/pdf', data: pdfBase64 } };
  }
}
function setPathChip() {
  const el = $('pathChip');
  if (!el) return;
  el.style.display = '';
  el.textContent = pdfPath === 'files-api' ? 'PDF sent by file reference (Files API)' : 'PDF sent inline (base64)';
}

/* ═══════════ GEMINI CALL CORE ═══════════ */
async function callGemini(apiKey, model, parts, opts) {
  opts = opts || {};
  const endpoint = `${API_BASE}/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = {
    contents: [{ parts: parts }],
    generationConfig: {
      temperature: opts.temperature !== undefined ? opts.temperature : 0.1,
      maxOutputTokens: opts.maxTokens || 32768,
      responseMimeType: 'application/json'
    },
    safetySettings: [
      { category: 'HARM_CATEGORY_HARASSMENT',       threshold: 'BLOCK_NONE' },
      { category: 'HARM_CATEGORY_HATE_SPEECH',       threshold: 'BLOCK_NONE' },
      { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE' },
      { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE' }
    ]
  };
  const resp = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await resp.json();
  if (data.error) {
    const msg = data.error.message || JSON.stringify(data.error);
    /* Adaptive retry when the output-token cap is not supported at 32k */
    if (/max_output_tokens|maxOutputTokens/i.test(msg) && (opts.maxTokens || 32768) > 8192) {
      return callGemini(apiKey, model, parts, Object.assign({}, opts, { maxTokens: 8192 }));
    }
    throw new Error(msg);
  }
  const cand = data.candidates && data.candidates[0];
  const usage = data.usageMetadata || {};
  const text = cand && cand.content && cand.content.parts && cand.content.parts[0] && cand.content.parts[0].text;
  if (!text) {
    const reason = (cand && cand.finishReason) || 'UNKNOWN';
    if (reason === 'MAX_TOKENS') throw new Error('MAX_TOKENS: model ran out of output space.');
    if (reason === 'SAFETY') throw new Error('SAFETY: safety filter fired (litigation-heavy sections can do this). Try another model.');
    if (reason === 'RECITATION') throw new Error('RECITATION: model refused to reproduce content. Try another model.');
    throw new Error('No content returned. Finish reason: ' + reason);
  }
  return { text: text, usage: usage };
}

/* JSON extraction with fence-stripping and bracket repair */
function extractJSON(text) {
  text = text.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
  const first = text.indexOf('{'), last = text.lastIndexOf('}');
  if (first === -1) throw new Error('No JSON object in response.');
  let js = last > first ? text.substring(first, last + 1) : text.substring(first);
  try { return JSON.parse(js); } catch (e) {}
  /* Truncation repair: cut back to the last complete value, close open brackets */
  let cut = js.lastIndexOf(',');
  if (cut > 0) js = js.substring(0, cut);
  const opens = [];
  let inStr = false, esc = false;
  for (let i = 0; i < js.length; i++) {
    const c = js[i];
    if (esc) { esc = false; continue; }
    if (c === '\\') { esc = true; continue; }
    if (c === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (c === '{' || c === '[') opens.push(c);
    else if (c === '}' || c === ']') opens.pop();
  }
  let closer = '';
  for (let i = opens.length - 1; i >= 0; i--) closer += opens[i] === '{' ? '}' : ']';
  return JSON.parse(js + closer);
}

/* Try the selected model, then the rest in order. Returns {json, model}. */
async function callWithFallback(apiKey, parts, opts, progressCb) {
  const primary = $('modelSelect').value;
  const order = [primary].concat(MODELS.map(m => m.id).filter(id => id !== primary));
  let lastErr = null;
  for (const model of order) {
    try {
      progressCb && progressCb(model);
      const r = await callGemini(apiKey, model, parts, opts);
      return { json: extractJSON(r.text), model: model, usage: r.usage, raw: r.text };
    } catch (e) {
      lastErr = e;
      /* Quota / rate errors → try next model. Hard input errors → stop. */
      if (/API key|invalid argument.*file|not found/i.test(e.message) && !/model/i.test(e.message)) throw e;
    }
  }
  throw lastErr || new Error('All models failed.');
}

/* ═══════════ PIPELINE ═══════════ */
function newPipeline() {
  const steps = {};
  STEP_DEFS.forEach(s => steps[s.key] = { status: 'pending', data: null, model: null, err: null });
  /* every runner must have a slot, even if the step list and the runners drift apart */
  ['upload', 'map', 'fin', 'cap', 'biz', 'dil', 'ana'].forEach(k => {
    if (!steps[k]) steps[k] = { status: 'pending', data: null, model: null, err: null };
  });
  return { steps };
}
function renderProgress() {
  if (!pipeline) return;
  $('progressSec').classList.add('show');
  $('progSteps').innerHTML = STEP_DEFS.map(s => {
    const st = pipeline.steps[s.key];
    const retry = st.status === 'fail' && s.key !== 'upload' ? ` <span class="retry" data-step="${s.key}">retry</span>` : '';
    const tok = st.usage ? (st.usage.promptTokenCount || st.usage.prompt_token_count || 0) : 0;
    const tokTxt = tok ? ' · ' + Math.round(tok / 1000) + 'k in' : '';
    const blind = (tok && tok < 20000 && s.key !== 'ana') ? ' <span style="color:var(--red)">PDF not seen</span>' : '';
    return `<span class="pstep ${st.status === 'pending' ? '' : st.status}"><span class="dot"></span>${s.label}${st.model ? ' · ' + escHtml(st.model.replace('gemini-', '')) : ''}${tokTxt}${blind}${retry}</span>`;
  }).join('');
  document.querySelectorAll('.pstep .retry').forEach(el => el.addEventListener('click', () => retryStep(el.dataset.step)));
}
function progNote(msg) { $('progNote').textContent = msg || ''; }
function renderDiagnostics() {
  if (!pipeline) return;
  const keys = ['fin', 'cap', 'biz', 'dil', 'ana'];
  const rows = keys.filter(k => pipeline.steps[k].usage || pipeline.steps[k].raw).map(k => {
    const st = pipeline.steps[k];
    const u = st.usage || {};
    const pt = u.promptTokenCount || u.prompt_token_count || 0;
    const ct = u.candidatesTokenCount || u.candidates_token_count || 0;
    return `<tr><td>${k}</td><td class="num">${pt.toLocaleString()}</td><td class="num">${ct.toLocaleString()}</td><td><span class="rawlink" data-step="${k}">view raw</span></td></tr>`;
  }).join('');
  const el = $('diagTable');
  if (!el) return;
  el.innerHTML = rows
    ? `<table class="val-table"><thead><tr><th>Step</th><th class="num">Input tokens</th><th class="num">Output tokens</th><th></th></tr></thead><tbody>${rows}</tbody></table>
       <div class="narrative" style="font-size:12px;color:var(--text-dim)">A 400-page DRHP is roughly 300,000-800,000 input tokens. Anything under ~20,000 means the model answered without the document.</div>`
    : '';
  document.querySelectorAll('.rawlink').forEach(a => a.addEventListener('click', () => {
    const st = pipeline.steps[a.dataset.step];
    $('rawOut').textContent = (st.raw || '(no raw text captured)').slice(0, 6000);
  }));
}

function saveDraft() {
  try {
    const d = {};
    ['map', 'fin', 'cap', 'biz', 'dil', 'ana'].forEach(k => { if (pipeline.steps[k].data) d[k] = pipeline.steps[k].data; });
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ ts: nowTs(), name: pdfFile ? pdfFile.name : '', d }));
  } catch (e) {}
}

/* The map is handed to later calls so they know which pages each chapter occupies. */
function mapContext() {
  const m = pipeline && pipeline.steps.map && pipeline.steps.map.data;
  if (!m || !m.contents || !m.contents.length) return null;
  const lines = m.contents.map(c => `${c.chapter}: pp. ${c.start_page}-${c.end_page}`).join('\n');
  return { text: 'For reference, this document\'s printed table of contents is below. Use it to locate the sections you need and to give accurate page_refs. Page numbers you report must be the PRINTED page numbers used here.\n\n' + lines };
}

async function runMapStep(apiKey) {
  const st = pipeline.steps.map;
  st.status = 'running'; st.err = null; renderProgress();
  const pdfPart = await ensurePdfPart(apiKey, progNote);
  const r = await callWithFallback(apiKey, [pdfPart, { text: P_MAP }], { temperature: 0 },
    m => { st.model = m; renderProgress(); });
  st.data = r.json; st.model = r.model; st.usage = r.usage; st.raw = r.raw; st.status = 'done';
  renderProgress(); renderDiagnostics(); saveDraft();
}

async function runExtractionStep(key, prompt, apiKey) {
  const st = pipeline.steps[key];
  st.status = 'running'; st.err = null; renderProgress();
  const pdfPart = await ensurePdfPart(apiKey, progNote);
  const parts = [pdfPart];
  const mc = mapContext();
  if (mc) parts.push(mc);
  parts.push({ text: prompt });
  const r = await callWithFallback(apiKey, parts, { temperature: 0.1 },
    m => { st.model = m; renderProgress(); });
  st.data = r.json; st.model = r.model; st.usage = r.usage; st.raw = r.raw; st.status = 'done';
  renderProgress(); renderDiagnostics(); saveDraft();
}
async function runAnalysisStep(apiKey) {
  const st = pipeline.steps.ana;
  st.status = 'running'; st.err = null; renderProgress();
  const ctx = {
    financials: pipeline.steps.fin.data,
    capital_and_issue: pipeline.steps.cap.data,
    business_and_industry: pipeline.steps.biz.data,
    diligence: pipeline.steps.dil.data
  };
  const r = await callWithFallback(apiKey, [{ text: P_ANA + JSON.stringify(ctx) }], { temperature: 0.3 },
    m => { st.model = m; renderProgress(); });
  st.data = r.json; st.model = r.model; st.usage = r.usage; st.raw = r.raw; st.status = 'done';
  renderProgress(); renderDiagnostics(); saveDraft();
}

const STEP_RUNNERS = {
  map: k => runMapStep(k),
  fin: k => runExtractionStep('fin', P_FIN, k),
  cap: k => runExtractionStep('cap', P_CAP, k),
  biz: k => runExtractionStep('biz', P_BIZ, k),
  dil: k => runExtractionStep('dil', P_DIL, k),
  ana: k => runAnalysisStep(k)
};

async function retryStep(key) {
  clearErr();
  const apiKey = $('apiKey').value.trim();
  try {
    await STEP_RUNNERS[key](apiKey);
    maybeFinish();
  } catch (e) {
    pipeline.steps[key].status = 'fail'; pipeline.steps[key].err = e.message;
    renderProgress(); showErr(STEP_DEFS.find(s => s.key === key).label + ' failed: ' + e.message);
  }
}

function maybeFinish() {
  const s = pipeline.steps;
  if (['fin', 'cap', 'biz', 'dil', 'ana'].every(k => s[k].status === 'done')) {
    const name = (s.fin.data && s.fin.data.company_name) || (pdfFile && pdfFile.name) || 'DRHP';
    A = {
      id: name.replace(/\s+/g, '_') + '_' + Date.now(),
      name, ts: nowTs(), band: null,
      fin: s.fin.data, cap: s.cap.data, biz: s.biz.data, dil: s.dil.data, ana: s.ana.data,
      map: s.map.data || null,
      pageOffset: (s.map.data && isNum(parseNum(s.map.data.pdf_page_of_printed_page_1)))
        ? parseNum(s.map.data.pdf_page_of_printed_page_1) - 1 : null
    };
    saveToHistory(A);
    progNote('Done. Analysis saved locally — reloading it later costs no API calls.');
    renderAll();
  } else if (['fin', 'cap', 'biz', 'dil'].every(k => s[k].status === 'done') && s.ana.status !== 'done' && s.ana.status !== 'running' && s.ana.status !== 'fail') {
    retryStep('ana');
  }
}

$('runBtn').addEventListener('click', async () => {
  clearErr();
  const apiKey = $('apiKey').value.trim();
  if (!apiKey || !pdfFile) return;
  $('runBtn').disabled = true;
  pipeline = newPipeline();
  $('results').classList.remove('show');
  try {
    pipeline.steps.upload.status = 'running'; renderProgress();
    await ensurePdfPart(apiKey, progNote);
    pipeline.steps.upload.status = 'done'; renderProgress();
    progNote('Extracting — each step is one API call. Failed steps can be retried individually.');
    try { await runMapStep(apiKey); }
    catch (e) {
      pipeline.steps.map.status = 'fail'; pipeline.steps.map.err = e.message; renderProgress();
      progNote('Document map failed — the run continues without it, but page references will be weaker.');
    }
    for (const key of ['fin', 'cap', 'biz', 'dil']) {
      try { await STEP_RUNNERS[key](apiKey); }
      catch (e) { pipeline.steps[key].status = 'fail'; pipeline.steps[key].err = e.message; renderProgress(); }
    }
    const failed = ['fin', 'cap', 'biz', 'dil'].filter(k => pipeline.steps[k].status !== 'done');
    if (failed.length) {
      showErr('Some extraction steps failed — use the retry link on each. The analysis step runs automatically once all four are done.');
    } else {
      await STEP_RUNNERS.ana(apiKey).catch(e => {
        pipeline.steps.ana.status = 'fail'; pipeline.steps.ana.err = e.message; renderProgress();
        showErr('Analysis step failed: ' + e.message);
      });
    }
    maybeFinish();
  } catch (e) {
    pipeline.steps.upload.status = 'fail'; renderProgress();
    showErr(e.message);
  } finally {
    $('runBtn').disabled = false;
  }
});

/* ═══════════ DERIVED METRICS ═══════════ */
function arrGet(o, path) {
  const v = path.split('.').reduce((a, k) => (a && a[k] !== undefined ? a[k] : null), o);
  return Array.isArray(v) ? v : [];
}
function normFin(fin) {
  /* pad/trim every array to periods length */
  const P = (fin.periods || []).length || 3;
  const fix = obj => { if (!obj) return; Object.keys(obj).forEach(k => {
    if (Array.isArray(obj[k])) { while (obj[k].length < P) obj[k].push(null); obj[k] = obj[k].slice(0, P).map(v => isNum(v) ? v : (parseNum(v))); }
  }); };
  fix(fin.pnl); fix(fin.balance_sheet); fix(fin.cash_flow);
  return fin;
}
function isStub(p) { return /\d+\s*m\b|month|stub|H1|Q[1-4]/i.test(p || ''); }

function computeDerived(fin) {
  fin = normFin(fin || {});
  const P = (fin.periods || []).length;
  const pnl = fin.pnl || {}, bs = fin.balance_sheet || {}, cf = fin.cash_flow || {};
  const g = (o, k, i) => { const a = o[k]; const v = a && a[i]; return isNum(v) ? v : null; };
  const D = { periods: fin.periods || [], stubIdx: [] };
  D.periods.forEach((p, i) => { if (isStub(p)) D.stubIdx.push(i); });
  const per = fnName => Array.from({ length: P }, (_, i) => fnName(i));
  const nz = v => isNum(v) && v !== 0;

  D.ebitda = per(i => {
    const pbt = g(pnl, 'pbt', i), dep = g(pnl, 'depreciation', i), fc = g(pnl, 'finance_costs', i), oi = g(pnl, 'other_income', i);
    if (pbt === null) return null;
    return pbt + (dep || 0) + (fc || 0) - (oi || 0);
  });
  D.ebitda_margin = per(i => { const r = g(pnl, 'revenue_operations', i); return nz(r) && isNum(D.ebitda[i]) ? D.ebitda[i] / r : null; });
  D.pat_margin    = per(i => { const r = g(pnl, 'revenue_operations', i), p = g(pnl, 'pat', i); return nz(r) && isNum(p) ? p / r : null; });
  D.gross_margin  = per(i => {
    const r = g(pnl, 'revenue_operations', i);
    if (!nz(r)) return null;
    const cm = g(pnl, 'cost_materials', i), pu = g(pnl, 'purchases_stock_in_trade', i), ci = g(pnl, 'changes_inventories', i);
    if (cm === null && pu === null) return null;
    return (r - (cm || 0) - (pu || 0) - (ci || 0)) / r;
  });
  const avg = (o, k, i) => {
    const cur = g(o, k, i);
    if (cur === null) return null;
    if (i === 0 || D.stubIdx.includes(i)) return cur;
    const prev = g(o, k, i - 1);
    return prev === null ? cur : (cur + prev) / 2;
  };
  D.borrowings = per(i => {
    const a = g(bs, 'borrowings_noncurrent', i), b = g(bs, 'borrowings_current', i), l = g(bs, 'lease_liabilities', i);
    if (a === null && b === null && l === null) return null;
    return (a || 0) + (b || 0) + (l || 0);
  });
  D.net_debt = per(i => isNum(D.borrowings[i]) ? D.borrowings[i] - (g(bs, 'cash_and_bank', i) || 0) : null);
  D.roe  = per(i => { const p = g(pnl, 'pat', i), e = avg(bs, 'total_equity', i); return isNum(p) && nz(e) ? p / e : null; });
  D.roce = per(i => {
    const pbt = g(pnl, 'pbt', i), fc = g(pnl, 'finance_costs', i);
    const e = avg(bs, 'total_equity', i);
    const cur = isNum(D.borrowings[i]) ? D.borrowings[i] : 0;
    const prevB = i > 0 && isNum(D.borrowings[i - 1]) ? D.borrowings[i - 1] : cur;
    const cap = (e || 0) + ((i === 0 || D.stubIdx.includes(i)) ? cur : (cur + prevB) / 2);
    return isNum(pbt) && cap > 0 ? (pbt + (fc || 0)) / cap : null;
  });
  D.roa = per(i => { const p = g(pnl, 'pat', i), a = avg(bs, 'total_assets', i); return isNum(p) && nz(a) ? p / a : null; });
  D.de  = per(i => { const e = g(bs, 'total_equity', i); return isNum(D.borrowings[i]) && nz(e) ? D.borrowings[i] / e : null; });
  D.nd_ebitda = per(i => isNum(D.net_debt[i]) && nz(D.ebitda[i]) ? D.net_debt[i] / D.ebitda[i] : null);
  D.int_cover = per(i => { const fc = g(pnl, 'finance_costs', i); return nz(fc) && isNum(D.ebitda[i]) ? D.ebitda[i] / fc : null; });
  const days = (o, k) => per(i => {
    if (D.stubIdx.includes(i)) return null;
    const r = g(pnl, 'revenue_operations', i), v = g(o, k, i);
    return nz(r) && isNum(v) ? v / r * 365 : null;
  });
  D.recv_days = days(bs, 'trade_receivables');
  D.inv_days  = days(bs, 'inventories');
  D.pay_days  = days(bs, 'trade_payables');
  D.ccc = per(i => (isNum(D.recv_days[i]) && isNum(D.inv_days[i]) && isNum(D.pay_days[i])) ? D.recv_days[i] + D.inv_days[i] - D.pay_days[i] : null);
  D.asset_turn = per(i => { const r = g(pnl, 'revenue_operations', i), a = avg(bs, 'total_assets', i); return D.stubIdx.includes(i) ? null : (nz(a) && isNum(r) ? r / a : null); });
  D.capex_pct = per(i => { const r = g(pnl, 'revenue_operations', i), c = g(cf, 'capex_ppe_purchase', i); return nz(r) && isNum(c) ? c / r : null; });
  D.cfo_pat = per(i => { const p = g(pnl, 'pat', i), c = g(cf, 'cfo', i); return nz(p) && isNum(c) ? c / p : null; });
  D.fcf = per(i => { const c = g(cf, 'cfo', i), x = g(cf, 'capex_ppe_purchase', i); return isNum(c) ? c - (x || 0) : null; });
  D.cwip_nb = per(i => { const w = g(bs, 'cwip', i), p = g(bs, 'ppe_net', i); return nz(p) && isNum(w) ? w / p : null; });

  /* CAGRs over full fiscal years only */
  const fyIdx = D.periods.map((p, i) => i).filter(i => !D.stubIdx.includes(i));
  const cagr = key => {
    if (fyIdx.length < 2) return null;
    const a = g(pnl, key, fyIdx[0]), b = g(pnl, key, fyIdx[fyIdx.length - 1]);
    const yrs = fyIdx.length - 1;
    return (isNum(a) && a > 0 && isNum(b) && b > 0) ? Math.pow(b / a, 1 / yrs) - 1 : null;
  };
  D.rev_cagr = cagr('revenue_operations');
  D.pat_cagr = cagr('pat');
  D.ebitda_cagr = (() => {
    if (fyIdx.length < 2) return null;
    const a = D.ebitda[fyIdx[0]], b = D.ebitda[fyIdx[fyIdx.length - 1]];
    return (isNum(a) && a > 0 && isNum(b) && b > 0) ? Math.pow(b / a, 1 / (fyIdx.length - 1)) - 1 : null;
  })();
  D.lastFy = fyIdx.length ? fyIdx[fyIdx.length - 1] : P - 1;

  /* Tie-outs */
  D.tie = { bs: [], cf: [] };
  for (let i = 0; i < P; i++) {
    const ta = g(bs, 'total_assets', i), tl = g(bs, 'total_equity_and_liabilities', i);
    D.tie.bs.push((isNum(ta) && isNum(tl)) ? (Math.abs(ta - tl) <= Math.max(Math.abs(ta) * 0.005, 1) ? 'pass' : 'fail') : 'na');
    const cfo = g(cf, 'cfo', i), cfi = g(cf, 'cfi', i), cff = g(cf, 'cff', i), nc = g(cf, 'net_change_in_cash', i);
    D.tie.cf.push((isNum(cfo) && isNum(cfi) && isNum(cff) && isNum(nc)) ? (Math.abs(cfo + cfi + cff - nc) <= Math.max(Math.abs(nc) * 0.02, 1) ? 'pass' : 'fail') : 'na');
  }
  return D;
}


/* ═══════════ PAGE REFERENCES ═══════════ */
function parsePages(s) {
  if (!s) return [];
  const m = String(s).match(/\d{1,4}/g);
  return m ? m.map(Number).filter(n => n > 0 && n < 3000) : [];
}
function chapterFor(page) {
  const c = (A.map && A.map.contents) || [];
  for (const ch of c) {
    const a = parseNum(ch.start_page), b = parseNum(ch.end_page);
    if (isNum(a) && isNum(b) && page >= a && page <= b) return ch.chapter || '';
  }
  return null;
}
function pdfPageOf(printed) {
  const off = isNum(A.pageOffset) ? A.pageOffset : null;
  return off === null ? null : printed + off;
}
/* Renders a page reference with the PDF page alongside, and flags refs that
   fall outside the chapter they should belong to. */
function refHtml(ref, expect) {
  if (!ref) return '';
  const pages = parsePages(ref);
  if (!pages.length) return `<span class="pageref">${escHtml(ref)}</span>`;
  const lo = Math.min.apply(null, pages), hi = Math.max.apply(null, pages);
  let pdfTxt = '';
  if (isNum(A.pageOffset)) {
    const a = pdfPageOf(lo), b = pdfPageOf(hi);
    pdfTxt = ' · PDF ' + (a === b ? a : a + '–' + b);
  }
  let warn = '';
  const contents = (A.map && A.map.contents) || [];
  if (contents.length) {
    const ch = chapterFor(lo);
    if (!ch) warn = '<span class="tie-badge fail" style="margin-left:8px">page not inside any chapter — check before citing</span>';
    else if (expect && !(new RegExp(expect, 'i')).test(ch)) warn = `<span class="tie-badge fail" style="margin-left:8px">falls in "${escHtml(ch)}" — check before citing</span>`;
  }
  return `<span class="pageref">${escHtml(ref)}${pdfTxt}</span>${warn}`;
}

/* ═══════════ RENDER: SHELL ═══════════ */
function renderAll() {
  if (!A) return;

  /* Shareholding & sellers */

  const waca = (cap.promoter_waca || []).map(w => `<tr><td>${escHtml(w.name)}</td><td class="num">${escHtml(w.waca_per_share)}</td></tr>`);
  const plc = (cap.pre_ipo_placements_18m || []).map(p => `<tr><td>${escHtml(p.date)}</td><td>${escHtml(p.nature)}</td><td class="num">${escHtml(p.price_per_share)}</td><td>${escHtml(p.parties)}</td></tr>`);
  html += secBlock('Shareholding, sellers & cost of acquisition',
    `<div class="two-col">
      <div>${kvTable([{t:'Top shareholders (pre-offer)'},{t:'Category'},{t:'%',num:1}], topSh)}</div>

    </div>
    <div class="section-label" style="margin-top:0.5rem">Selling in the OFS</div>

    <div class="section-label" style="margin-top:0.5rem">Pre-IPO issuances — last 18 months</div>
    ${kvTable([{t:'Date'},{t:'Nature'},{t:'Price/share',num:1},{t:'Parties'}], plc)}`,
    (cap.page_refs || {}).capital_structure, 'capital structure');

  $('tab-overview').innerHTML = html;
  wireBandPanel();
}

/* ═══════════ PRICE BAND ═══════════ */
function bandDefaults() {
  const D = A.derived, fin = A.fin || {}, cap = A.cap || {};
  const f = unitToCrFactor(fin.currency_unit);
  const i = D.lastFy;
  const gv = (o, k) => { const a = (o || {})[k]; const v = a && a[i]; return isNum(v) ? v * f : null; };
  const shares = parseNum((cap.pre_issue_shares_outstanding || '')); /* absolute count */
  const repay = (cap.issue && (cap.issue.use_of_proceeds || []).filter(u => /debt|repay/i.test(u.purpose || '')).map(u => parseAmountToCr(u.amount)).filter(isNum).reduce((a, b) => a + b, 0)) || 0;
  return {
    freshCr: parseAmountToCr((cap.issue || {}).fresh_issue_amount),
    preSharesCr: isNum(shares) ? shares / 1e7 : null,
    patCr: gv(fin.pnl, 'pat'),
    revCr: gv(fin.pnl, 'revenue_operations'),
    ebitdaCr: isNum(D.ebitda[i]) ? D.ebitda[i] * f : null,
    equityCr: gv(fin.balance_sheet, 'total_equity'),
    debtCr: isNum(D.borrowings[i]) ? D.borrowings[i] * f : null,
    cashCr: gv(fin.balance_sheet, 'cash_and_bank'),
    repayCr: repay || null
  };
}
function bandPanelHtml() {
  const b = (A.band && A.band.inputs) || {};
  const d = bandDefaults();
  const val = (k, dec) => b[k] !== undefined && b[k] !== null ? b[k] : (isNum(d[k]) ? +d[k].toFixed(dec === undefined ? 1 : dec) : '');
  return `
  <div class="narrative">A DRHP has no price — the band arrives ~5 days before the offer opens. Enter it here (or a scenario price) and the implied multiples compute locally, no API call. Assumption fields are pre-filled from the extraction (converted to ₹ crore) and editable.</div>
  <div class="band-grid">
    <div><label>Floor price ₹</label><input id="bandFloor" type="number" value="${A.band && A.band.floor || ''}"></div>
    <div><label>Cap price ₹</label><input id="bandCap" type="number" value="${A.band && A.band.cap || ''}"></div>
    <div><label>Fresh issue ₹ Cr</label><input id="bFresh" type="number" value="${val('freshCr')}"></div>
    <div><label>Pre-issue shares (Cr)</label><input id="bShares" type="number" step="0.01" value="${val('preSharesCr', 2)}"></div>
    <div><label>PAT ₹ Cr (latest FY)</label><input id="bPat" type="number" value="${val('patCr')}"></div>
    <div><label>Revenue ₹ Cr</label><input id="bRev" type="number" value="${val('revCr')}"></div>
    <div><label>EBITDA ₹ Cr</label><input id="bEbitda" type="number" value="${val('ebitdaCr')}"></div>
    <div><label>Net worth ₹ Cr</label><input id="bEquity" type="number" value="${val('equityCr')}"></div>
    <div><label>Total debt ₹ Cr</label><input id="bDebt" type="number" value="${val('debtCr')}"></div>
    <div><label>Cash ₹ Cr</label><input id="bCash" type="number" value="${val('cashCr')}"></div>
    <div><label>Debt repaid from proceeds ₹ Cr</label><input id="bRepay" type="number" value="${val('repayCr')}"></div>
  </div>
  <div class="band-check"><input type="checkbox" id="bRepayChk" ${A.band && A.band.useRepay ? 'checked' : ''}> <label for="bRepayChk">Reduce debt by the repayment amount when computing EV (post-money view)</label></div>
  <button class="ghost-btn" id="bandCompute">Compute implied multiples</button>
  <div id="bandOut" style="margin-top:1rem">${A.band && A.band.outHtml ? A.band.outHtml : ''}</div>`;
}
function wireBandPanel() {
  const btn = $('bandCompute');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const num = id => { const v = parseFloat($(id).value); return isFinite(v) ? v : null; };
    const floor = num('bandFloor'), cap = num('bandCap');
    const inp = { freshCr: num('bFresh'), preSharesCr: num('bShares'), patCr: num('bPat'), revCr: num('bRev'), ebitdaCr: num('bEbitda'), equityCr: num('bEquity'), debtCr: num('bDebt'), cashCr: num('bCash'), repayCr: num('bRepay') };
    const useRepay = $('bRepayChk').checked;
    if (!isNum(cap) && !isNum(floor)) { $('bandOut').innerHTML = '<div class="narrative">Enter at least one price.</div>'; return; }
    const prices = [];
    if (isNum(floor)) prices.push(['Floor ₹' + floor, floor]);
    if (isNum(cap)) prices.push(['Cap ₹' + cap, cap]);
    const rows = [];
    const medPe = median((((A.cap || {}).peer_comparison || {}).peers || []).map(p => parseNum(p.pe)));
    const line = (label, fn, fmt) => {
      rows.push(`<tr><td>${escHtml(label)}</td>${prices.map(pp => `<td class="num">${fmt(fn(pp[1]))}</td>`).join('')}</tr>`);
    };
    const calc = price => {
      const newShares = isNum(inp.freshCr) && price > 0 ? inp.freshCr / price : 0;
      const postShares = (inp.preSharesCr || 0) + newShares;
      const mcap = postShares * price;
      const netProceeds = inp.freshCr || 0;
      const debt = (inp.debtCr || 0) - (useRepay ? Math.min(inp.repayCr || 0, inp.debtCr || 0) : 0);
      const ev = mcap + debt - ((inp.cashCr || 0) + (useRepay ? 0 : 0));
      return { newShares, postShares, mcap, ev,
        epsPost: postShares > 0 && isNum(inp.patCr) ? inp.patCr / postShares : null,
        epsPre: (inp.preSharesCr || 0) > 0 && isNum(inp.patCr) ? inp.patCr / inp.preSharesCr : null,
        pb: isNum(inp.equityCr) && (inp.equityCr + netProceeds) > 0 ? mcap / (inp.equityCr + netProceeds) : null };
    };
    const C = {}; prices.forEach(pp => C[pp[1]] = calc(pp[1]));
    line('New shares issued (Cr)', p => C[p].newShares, v => fmtNum(v, 2));
    line('Post-issue shares (Cr)', p => C[p].postShares, v => fmtNum(v, 2));
    line('Implied market cap ₹ Cr', p => C[p].mcap, v => fmtNum(v, 0));
    line('EV ₹ Cr', p => C[p].ev, v => fmtNum(v, 0));
    line('EPS post-issue ₹', p => C[p].epsPost, v => fmtNum(v, 1));
    line('P/E (post-issue)', p => isNum(C[p].epsPost) && C[p].epsPost > 0 ? p / C[p].epsPost : null, fmtX);
    line('P/E (pre-issue EPS, as DRHP quotes it)', p => isNum(C[p].epsPre) && C[p].epsPre > 0 ? p / C[p].epsPre : null, fmtX);
    line('P/B (post-money)', p => C[p].pb, fmtX);
    line('EV / EBITDA', p => isNum(inp.ebitdaCr) && inp.ebitdaCr > 0 ? C[p].ev / inp.ebitdaCr : null, fmtX);
    line('EV / Sales', p => isNum(inp.revCr) && inp.revCr > 0 ? C[p].ev / inp.revCr : null, fmtX);
    if (medPe !== null) line('Premium / (discount) to peer median P/E', p => { const c = C[p]; return isNum(c.epsPost) && c.epsPost > 0 ? (p / c.epsPost) / medPe - 1 : null; }, fmtPct);
    const out = `<table class="val-table"><thead><tr><th>Implied at band</th>${prices.map(pp => `<th class="num">${escHtml(pp[0])}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>
    <div class="narrative" style="font-size:12px;color:var(--text-dim)">Fresh shares = fresh amount ÷ price, so the post-issue count differs at floor vs cap. The DRHP's own "Basis for Offer Price" quotes pre-issue EPS — both views shown. Peer median P/E from the peer table${medPe !== null ? ' (' + medPe.toFixed(1) + 'x)' : ''}.</div>`;
    $('bandOut').innerHTML = out;
    /* fill WACA multiples in the OFS table */
    const capPrice = isNum(cap) ? cap : floor;
    document.querySelectorAll('.waca-mult').forEach(td => {
      const w = parseNum(td.dataset.waca);
      td.textContent = (isNum(w) && w > 0 && isNum(capPrice)) ? (capPrice / w).toFixed(1) + 'x' : '—';
    });
    A.band = { floor, cap, inputs: inp, useRepay, outHtml: out };
    saveToHistory(A);
  });
}


/* ═══════════ WHERE TO LOOK ═══════════ */
function renderWhereToLook() {
  const m = A.map || {};
  let html = '';

  const off = isNum(A.pageOffset) ? A.pageOffset : '';
  html += secBlock('Page calibration',
    `<div class="narrative">A DRHP's printed page numbers do not match the PDF's own page count — there are usually twenty to forty pages of front matter first. Open the PDF, find the page printed as <strong>1</strong>, and enter which PDF page that is. Every reference in this tool then shows both numbers.</div>
     <div class="band-grid" style="max-width:420px">
       <div><label>PDF page showing printed page 1</label><input id="offsetInput" type="number" value="${isNum(A.pageOffset) ? A.pageOffset + 1 : ''}"></div>
     </div>
     <button class="ghost-btn" id="offsetApply">Apply</button>
     ${m.pdf_page_of_printed_page_1 ? `<span class="chip info" style="margin-left:10px">Model's guess: PDF page ${escHtml(String(m.pdf_page_of_printed_page_1))} — confirm it yourself</span>` : ''}`);

  const gi = m.gap_index || [];
  if (gi.length) {
    const rows = gi.map(g => {
      const pages = parsePages(g.pages);
      const pdf = (pages.length && isNum(A.pageOffset)) ? (pdfPageOf(Math.min.apply(null, pages)) + (pages.length > 1 ? '–' + pdfPageOf(Math.max.apply(null, pages)) : '')) : '—';
      return `<tr><td>${escHtml(g.topic)}</td><td>${escHtml(g.where || '')}</td><td class="num">${escHtml(g.pages || '—')}</td><td class="num">${escHtml(String(pdf))}</td><td style="font-size:12px;color:var(--text-muted)">${escHtml(g.what_you_will_find || '')}</td></tr>`;
    });
    html += secBlock('Not extracted above — here is where to find it',
      `<div class="narrative">These sections are deliberately left out of the analysis: pulling their contents would cost more of the model's limited writing space than they are worth on every run. What you get instead is a pointer. Open the page, read it yourself.</div>
       ${kvTable([{t:'Topic'},{t:'Chapter'},{t:'Printed pp.',num:1},{t:'PDF pp.',num:1},{t:'What is there'}], rows)}`);
  }

  const fi = m.financial_statements_index || [];
  if (fi.length) {
    const rows = fi.map(f => {
      const pages = parsePages(f.pages);
      const pdf = (pages.length && isNum(A.pageOffset)) ? (pdfPageOf(Math.min.apply(null, pages)) + (pages.length > 1 ? '–' + pdfPageOf(Math.max.apply(null, pages)) : '')) : '—';
      return `<tr><td>${escHtml(f.item)}</td><td class="num">${escHtml(f.pages || '—')}</td><td class="num">${escHtml(String(pdf))}</td></tr>`;
    });
    html += secBlock('Inside the restated financial statements', kvTable([{t:'Statement or note'},{t:'Printed pp.',num:1},{t:'PDF pp.',num:1}], rows));
  }

  const c = m.contents || [];
  if (c.length) {
    const rows = c.map(ch => {
      const a = parseNum(ch.start_page), b = parseNum(ch.end_page);
      const pdf = (isNum(a) && isNum(A.pageOffset)) ? pdfPageOf(a) + (isNum(b) ? '–' + pdfPageOf(b) : '') : '—';
      return `<tr><td>${escHtml(ch.chapter)}</td><td class="num">${isNum(a) ? a : '—'}${isNum(b) ? '–' + b : ''}</td><td class="num">${escHtml(String(pdf))}</td><td class="num">${(isNum(a) && isNum(b)) ? (b - a + 1) : '—'}</td></tr>`;
    });
    html += secBlock('Chapter map' + (m.total_printed_pages ? ' — ' + escHtml(String(m.total_printed_pages)) + ' printed pages' : ''),
      kvTable([{t:'Chapter'},{t:'Printed pp.',num:1},{t:'PDF pp.',num:1},{t:'Pages',num:1}], rows));
  }

  if (!c.length && !gi.length) {
    html += secBlock('Document map', '<div class="narrative">The map step did not run or returned nothing. Re-run it from the progress panel — it is one API call and it also improves the page references on the other tabs.</div>');
  }

  $('tab-wheretolook').innerHTML = html;
  const ap = $('offsetApply');
  if (ap) ap.addEventListener('click', () => {
    const v = parseFloat($('offsetInput').value);
    A.pageOffset = isFinite(v) ? Math.round(v) - 1 : null;
    if (storageWorks()) saveToHistory(A);
    renderAll();
  });
}

function stmtTable(rowsDef, obj, D, calcRows) {
  const P = D.periods.length;
  let head = '<th>Line item</th>' + D.periods.map((p, i) => `<th${D.stubIdx.includes(i) ? ' class="stub"' : ''}>${escHtml(p)}</th>`).join('');
  let body = '';
  rowsDef.forEach(rd => {
    const key = rd[0], label = rd[1], cls = rd[2] || '';
    if (cls === 'grp') { body += `<tr class="grp"><td colspan="${P + 1}">${escHtml(label)}</td></tr>`; return; }
    const arr = (obj || {})[key] || [];
    if (!arr.some(isNum)) return;
    body += `<tr class="${cls}"><td>${escHtml(label)}</td>` + Array.from({ length: P }, (_, i) =>
      `<td${D.stubIdx.includes(i) ? ' class="stub"' : ''}>${fmtNum(arr[i])}</td>`).join('') + '</tr>';
  });
  (calcRows || []).forEach(cr => {
    if (!cr.vals.some(isNum)) return;
    body += `<tr class="calc"><td>${escHtml(cr.label)}</td>` + cr.vals.map((v, i) =>
      `<td${D.stubIdx.includes(i) ? ' class="stub"' : ''}>${cr.fmt ? cr.fmt(v) : fmtNum(v)}</td>`).join('') + '</tr>';
  });
  return `<div style="overflow-x:auto"><table class="fin-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function tieBadge(label, states) {
  const worst = states.includes('fail') ? 'fail' : states.every(s => s === 'na') ? 'na' : 'pass';
  const txt = worst === 'pass' ? label + ' ties' : worst === 'fail' ? label + ' does NOT tie' : label + ' — not checkable';
  return `<span class="tie-badge ${worst}" title="${states.join(', ')}">${txt}</span>`;
}

/* ═══════════ EXCEL EXPORT ═══════════ */
function colLetter(n) { /* 0-based → A, B, C ... */
  let s = '';
  n = n + 1;
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function buildStmtSheet(rowsDef, obj, D, calcRows) {
  /* Returns { aoa, rowOf } where rowOf[key] = 1-based Excel row */
  const aoa = [];
  const rowOf = {};
  aoa.push(['Line item'].concat(D.periods));
  rowsDef.forEach(rd => {
    const key = rd[0], label = rd[1], cls = rd[2] || '';
    if (cls === 'grp') { aoa.push([label]); return; }
    const arr = (obj || {})[key] || [];
    if (!arr.some(isNum)) return;
    aoa.push([label].concat(D.periods.map((p, i) => isNum(arr[i]) ? arr[i] : null)));
    rowOf[key] = aoa.length;
  });
  (calcRows || []).forEach(cr => {
    if (!cr.vals.some(isNum)) return;
    aoa.push([cr.label].concat(cr.vals.map(v => isNum(v) ? v : null)));
    rowOf[cr.key] = aoa.length;
  });
  return { aoa: aoa, rowOf: rowOf };
}
function exportExcel() {
  if (!A) return;
  const D = A.derived, fin = A.fin || {}, cap = A.cap || {}, biz = A.biz || {}, dil = A.dil || {}, ana = A.ana || {};
  const P = D.periods.length;
  const wb = XLSX.utils.book_new();

  const pnl = buildStmtSheet(PNL_ROWS, fin.pnl, D, [{ key: 'ebitda', label: 'EBITDA (calc)', vals: D.ebitda }]);
  const bs  = buildStmtSheet(BS_ROWS, fin.balance_sheet, D, [
    { key: 'borrowings', label: 'Total borrowings (calc)', vals: D.borrowings },
    { key: 'net_debt', label: 'Net debt (calc)', vals: D.net_debt }
  ]);
  const cf  = buildStmtSheet(CF_ROWS, fin.cash_flow, D, [{ key: 'fcf', label: 'Free cash flow (calc)', vals: D.fcf }]);

  const wsPnl = XLSX.utils.aoa_to_sheet(pnl.aoa);
  const wsBs  = XLSX.utils.aoa_to_sheet(bs.aoa);
  const wsCf  = XLSX.utils.aoa_to_sheet(cf.aoa);
  wsPnl['!cols'] = [{ wch: 34 }].concat(D.periods.map(() => ({ wch: 14 })));
  wsBs['!cols']  = wsPnl['!cols']; wsCf['!cols'] = wsPnl['!cols'];
  XLSX.utils.book_append_sheet(wb, wsPnl, 'PnL');
  XLSX.utils.book_append_sheet(wb, wsBs, 'BS');
  XLSX.utils.book_append_sheet(wb, wsCf, 'CF');

  /* ── Ratios sheet: live formulas into the statement sheets ── */
  const ref = (sheet, map, key, i) => map[key] ? `${sheet}!${colLetter(i + 1)}${map[key]}` : null;
  const pRef = (k, i) => ref('PnL', pnl.rowOf, k, i);
  const bRef = (k, i) => ref('BS', bs.rowOf, k, i);
  const cRef = (k, i) => ref('CF', cf.rowOf, k, i);
  /* average balance: first period or stub → closing only */
  const bAvg = (k, i) => {
    const cur = bRef(k, i);
    if (!cur) return null;
    if (i === 0 || D.stubIdx.includes(i)) return cur;
    const prev = bRef(k, i - 1);
    return prev ? `((${cur}+${prev})/2)` : cur;
  };
  const div = (a, b) => (a && b) ? `IFERROR(${a}/${b},"")` : null;

  const ratioDefs = [
    ['Profitability', null],
    ['EBITDA margin', i => div(pRef('ebitda', i), pRef('revenue_operations', i))],
    ['PAT margin', i => div(pRef('pat', i), pRef('revenue_operations', i))],
    ['Returns', null],
    ['ROE', i => div(pRef('pat', i), bAvg('total_equity', i))],
    ['ROCE', i => {
      const pbt = pRef('pbt', i), fc = pRef('finance_costs', i), eq = bAvg('total_equity', i), bo = bAvg('borrowings', i);
      return (pbt && eq) ? `IFERROR((${pbt}${fc ? '+' + fc : ''})/(${eq}${bo ? '+' + bo : ''}),"")` : null;
    }],
    ['ROA', i => div(pRef('pat', i), bAvg('total_assets', i))],
    ['Leverage', null],
    ['Debt / equity', i => div(bRef('borrowings', i), bRef('total_equity', i))],
    ['Net debt / EBITDA', i => div(bRef('net_debt', i), pRef('ebitda', i))],
    ['Interest cover', i => div(pRef('ebitda', i), pRef('finance_costs', i))],
    ['Working capital', null],
    ['Receivable days', i => D.stubIdx.includes(i) ? null : (div(bRef('trade_receivables', i), pRef('revenue_operations', i)) ? `IFERROR(${bRef('trade_receivables', i)}/${pRef('revenue_operations', i)}*365,"")` : null)],
    ['Inventory days', i => D.stubIdx.includes(i) ? null : (bRef('inventories', i) && pRef('revenue_operations', i) ? `IFERROR(${bRef('inventories', i)}/${pRef('revenue_operations', i)}*365,"")` : null)],
    ['Payable days', i => D.stubIdx.includes(i) ? null : (bRef('trade_payables', i) && pRef('revenue_operations', i) ? `IFERROR(${bRef('trade_payables', i)}/${pRef('revenue_operations', i)}*365,"")` : null)],
    ['Asset turnover', i => D.stubIdx.includes(i) ? null : div(pRef('revenue_operations', i), bAvg('total_assets', i))],
    ['Cash & capex', null],
    ['CFO / PAT', i => div(cRef('cfo', i), pRef('pat', i))],
    ['Capex / revenue', i => div(cRef('capex_ppe_purchase', i), pRef('revenue_operations', i))],
    ['FCF', i => cRef('fcf', i) ? `IFERROR(${cRef('fcf', i)},"")` : null]
  ];
  const rAoa = [['Ratio'].concat(D.periods)];
  const formulaCells = [];
  ratioDefs.forEach(rd => {
    const label = rd[0], fn = rd[1];
    if (!fn) { rAoa.push([label]); return; }
    const row = [label];
    const fs = [];
    for (let i = 0; i < P; i++) { const f = fn(i); fs.push(f); row.push(null); }
    if (!fs.some(Boolean)) return;
    rAoa.push(row);
    formulaCells.push({ r: rAoa.length - 1, fs: fs });
  });
  const wsR = XLSX.utils.aoa_to_sheet(rAoa);
  formulaCells.forEach(fc2 => {
    fc2.fs.forEach((f, i) => {
      if (!f) return;
      const addr = colLetter(i + 1) + (fc2.r + 1);
      wsR[addr] = { t: 'n', f: f };
    });
  });
  wsR['!cols'] = [{ wch: 26 }].concat(D.periods.map(() => ({ wch: 14 })));
  XLSX.utils.book_append_sheet(wb, wsR, 'Ratios');

  /* ── Peers ── */
  const pc = cap.peer_comparison || {};
  const pAoa = [['Company', 'Revenue', 'EPS', 'P/E', 'RoNW %', 'NAV/share']];
  if (pc.company_row) { const c = pc.company_row; pAoa.push([c.name, c.revenue, c.eps, c.pe, c.ronw_pct, c.nav_per_share]); }
  (pc.peers || []).forEach(p => pAoa.push([p.name, p.revenue, p.eps, p.pe, p.ronw_pct, p.nav_per_share]));
  const medPe = median((pc.peers || []).map(p => parseNum(p.pe)));
  const medRonw = median((pc.peers || []).map(p => parseNum(p.ronw_pct)));
  pAoa.push([]);
  pAoa.push(['Peer median', '', '', medPe, medRonw, '']);
  if (pc.source_note) { pAoa.push([]); pAoa.push([pc.source_note]); }
  const wsP = XLSX.utils.aoa_to_sheet(pAoa);
  wsP['!cols'] = [{ wch: 34 }, { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, wsP, 'Peers');

  /* ── Issue & holders ── */
  const iss = cap.issue || {}, sh = cap.shareholding || {};
  const iAoa = [['Offer structure', '']];
  iAoa.push(['Fresh issue', iss.fresh_issue_amount]);
  iAoa.push(['Offer for sale', iss.ofs_amount_or_shares]);
  iAoa.push(['Total issue size', iss.total_issue_size]);
  iAoa.push(['Face value', iss.face_value]);
  iAoa.push(['Pre-issue shares outstanding', cap.pre_issue_shares_outstanding]);
  iAoa.push(['General corporate purposes %', iss.gcp_pct]);
  iAoa.push([]);
  iAoa.push(['Use of fresh proceeds', 'Amount', '% of fresh']);
  (iss.use_of_proceeds || []).forEach(u => iAoa.push([u.purpose, u.amount, u.pct_of_fresh]));
  iAoa.push([]);
  iAoa.push(['Shareholding', '', '']);
  iAoa.push(['Promoter pre-IPO %', sh.promoter_pre_ipo_pct]);
  iAoa.push(['Promoter post-IPO %', sh.promoter_post_ipo_pct]);
  iAoa.push([]);
  iAoa.push(['Top shareholders (pre-offer)', 'Category', '%']);
  (sh.top_shareholders_pre || []).forEach(s => iAoa.push([s.name, s.category, s.pct]));
  iAoa.push([]);
  iAoa.push(['OFS sellers', 'Type', 'Size', 'WACA/share']);
  (cap.ofs_sellers || []).forEach(s => iAoa.push([s.name, s.type, s.shares_or_amount, s.waca_per_share]));
  iAoa.push([]);
  iAoa.push(['Promoter WACA', '₹/share']);
  (cap.promoter_waca || []).forEach(w => iAoa.push([w.name, w.waca_per_share]));
  iAoa.push([]);
  iAoa.push(['Pre-IPO issuances (18m)', 'Nature', 'Price/share', 'Parties']);
  (cap.pre_ipo_placements_18m || []).forEach(p => iAoa.push([p.date, p.nature, p.price_per_share, p.parties]));
  if (A.band) {
    iAoa.push([]);
    iAoa.push(['Price band entered', 'Floor', A.band.floor, 'Cap', A.band.cap]);
  }
  const wsI = XLSX.utils.aoa_to_sheet(iAoa);
  wsI['!cols'] = [{ wch: 38 }, { wch: 20 }, { wch: 18 }, { wch: 22 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, wsI, 'Issue');

  /* ── Diligence ── */
  const dAoa = [['Red flags', 'Severity', 'Category', 'Evidence']];
  (ana.red_flags || []).forEach(f => dAoa.push([f.flag, f.severity, f.category, f.evidence]));
  dAoa.push([]);
  dAoa.push(['Risk scorecard', 'Rating', 'Comment']);
  (ana.risk_scorecard || []).forEach(r => dAoa.push([r.criteria, r.rating, r.comment]));
  dAoa.push([]);
  dAoa.push(['Litigation summary', 'Count', 'Amount']);
  ((dil.litigation || {}).summary || []).forEach(l => dAoa.push([l.category, l.count, l.amount]));
  dAoa.push([]);
  dAoa.push(['Material cases', 'Forum', 'Amount', 'Description']);
  ((dil.litigation || {}).material_cases || []).forEach(l => dAoa.push([l.party, l.forum, l.amount, l.description]));
  dAoa.push([]);
  dAoa.push(['RPT by year', 'Total', '% of revenue']);
  ((dil.related_party_transactions || {}).by_year || []).forEach(r => dAoa.push([r.period, r.total_amount, r.pct_of_revenue]));
  dAoa.push([]);
  dAoa.push(['Material RPTs', 'Relationship', 'Nature', 'Amount', 'Period']);
  ((dil.related_party_transactions || {}).material || []).forEach(r => dAoa.push([r.counterparty, r.relationship, r.nature, r.amount, r.period]));
  dAoa.push([]);
  dAoa.push(['Facilities', 'Type', 'Sanctioned', 'Outstanding', 'Rate', 'Security', 'Covenants']);
  ((dil.indebtedness || {}).facilities || []).forEach(f => dAoa.push([f.lender, f.type, f.sanctioned, f.outstanding, f.interest_rate, f.security, f.key_covenants]));
  dAoa.push([]);
  dAoa.push(['Auditor matters']);
  const am = dil.auditor_matters || {};
  (am.qualifications || []).forEach(x => dAoa.push(['Qualification', x]));
  (am.emphasis_of_matter || []).forEach(x => dAoa.push(['Emphasis of matter', x]));
  (am.caro_or_other_remarks || []).forEach(x => dAoa.push(['CARO / other', x]));
  dAoa.push([]);
  dAoa.push(['Thesis']);
  const th = ana.thesis || {};
  dAoa.push(['Bull case', th.bull_case]);
  dAoa.push(['Bear case', th.bear_case]);
  (th.key_monitorables || []).forEach(m => dAoa.push(['Monitorable', m]));
  dAoa.push(['Verdict', (ana.verdict || '') + ' — ' + (ana.verdict_reason || '')]);
  const wsD = XLSX.utils.aoa_to_sheet(dAoa);
  wsD['!cols'] = [{ wch: 40 }, { wch: 16 }, { wch: 18 }, { wch: 46 }, { wch: 14 }, { wch: 26 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, wsD, 'Diligence');

  /* ── Sources & gaps ── */
  const m = A.map || {};
  const sAoa = [['Where to look in the DRHP']];
  sAoa.push(['Printed page 1 is PDF page', isNum(A.pageOffset) ? A.pageOffset + 1 : 'not calibrated']);
  sAoa.push([]);
  sAoa.push(['Not extracted — where to find it', 'Chapter', 'Printed pp.', 'What is there']);
  (m.gap_index || []).forEach(g => sAoa.push([g.topic, g.where, g.pages, g.what_you_will_find]));
  sAoa.push([]);
  sAoa.push(['Inside the restated financials', 'Printed pp.']);
  (m.financial_statements_index || []).forEach(f => sAoa.push([f.item, f.pages]));
  sAoa.push([]);
  sAoa.push(['Chapter', 'Start page', 'End page']);
  (m.contents || []).forEach(c => sAoa.push([c.chapter, c.start_page, c.end_page]));
  sAoa.push([]);
  sAoa.push(['Page references used in this analysis', 'Printed pp.']);
  [['P&L', (A.fin.page_refs || {}).pnl], ['Balance sheet', (A.fin.page_refs || {}).balance_sheet], ['Cash flow', (A.fin.page_refs || {}).cash_flow],
   ['Offer', (A.cap.page_refs || {}).issue], ['Capital structure', (A.cap.page_refs || {}).capital_structure], ['Basis for offer price', (A.cap.page_refs || {}).basis_for_offer_price],
   ['Business', (A.biz.page_refs || {}).business], ['Industry', (A.biz.page_refs || {}).industry], ['Management', (A.biz.page_refs || {}).management],
   ['Litigation', (A.dil.page_refs || {}).litigation], ['Indebtedness', (A.dil.page_refs || {}).indebtedness], ['Related parties', (A.dil.page_refs || {}).rpt]
  ].forEach(r => { if (r[1]) sAoa.push(r); });
  const wsS = XLSX.utils.aoa_to_sheet(sAoa);
  wsS['!cols'] = [{ wch: 46 }, { wch: 34 }, { wch: 16 }, { wch: 52 }];
  XLSX.utils.book_append_sheet(wb, wsS, 'Sources');

  const safe = (A.name || 'DRHP').replace(/[^\w\-]+/g, '_').slice(0, 40);
  XLSX.writeFile(wb, safe + '_DRHP_model.xlsx');
}
$('btnExcel').addEventListener('click', () => {
  try { exportExcel(); } catch (e) { showErr('Excel export failed: ' + e.message); }
});

/* ═══════════ INIT ═══════════ */
$('testPdfBtn').addEventListener('click', testPdfRead);

/* ═══════════ PERSISTENCE ═══════════ */
function storageWorks() {
  try {
    localStorage.setItem('drhp_probe', '1');
    const ok = localStorage.getItem('drhp_probe') === '1';
    localStorage.removeItem('drhp_probe');
    return ok;
  } catch (e) { return false; }
}
const KEY_STORE = 'drhp_api_key';
function saveKeyIfWanted() {
  if (!storageWorks()) return;
  try {
    if ($('rememberKey').checked) localStorage.setItem(KEY_STORE, $('apiKey').value.trim());
    else localStorage.removeItem(KEY_STORE);
  } catch (e) {}
}
$('rememberKey').addEventListener('change', saveKeyIfWanted);
$('apiKey').addEventListener('change', saveKeyIfWanted);
$('apiKey').addEventListener('blur', saveKeyIfWanted);

/* Save / load a finished analysis as a file — works even when the browser blocks storage */
$('btnSaveJson').addEventListener('click', () => {
  if (!A) return;
  const blob = new Blob([JSON.stringify(A, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (A.name || 'DRHP').replace(/[^\w\-]+/g, '_').slice(0, 40) + '_analysis.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});
$('btnLoadJson').addEventListener('click', () => $('jsonInput').click());
$('jsonInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const b = JSON.parse(r.result);
      if (!b.fin) throw new Error('That file is not a saved DRHP analysis.');
      A = b;
      if (storageWorks()) saveToHistory(A);
      clearErr();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) { showErr('Could not load that file: ' + err.message); }
  };
  r.readAsText(f);
});

(function init() {
  $('modelSelect').innerHTML = MODELS.map(m => `<option value="${m.id}">${escHtml(m.label)}</option>`).join('');
  if (storageWorks()) {
    try {
      const k = localStorage.getItem(KEY_STORE);
      if (k) { $('apiKey').value = k; $('rememberKey').checked = true; }
    } catch (e) {}
  } else {
    const w = $('storageWarn');
    w.style.display = '';
    w.innerHTML = 'This page cannot save anything on this device — the browser is blocking local storage. That is normal when an HTML file is opened straight from Downloads on a phone. The key, the theme and past analyses will all be lost on reload. Move the file to a folder and open it in desktop Chrome, or use <strong>Save analysis to file</strong> after each run and reload it later with <strong>Load an analysis from a file</strong>.';
  }
  renderHistoryChips();
  updateRunBtn();
})();

</script>
